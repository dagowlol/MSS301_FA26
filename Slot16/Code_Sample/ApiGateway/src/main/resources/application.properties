spring.application.name=DE190484ApiGateway
server.port=8080

# -- Spring Cloud Gateway WebFlux Routes --
# Service 1 Route
spring.cloud.gateway.server.webflux.routes[0].id=entity1-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/entity1/**

# Service 2 Route
spring.cloud.gateway.server.webflux.routes[1].id=entity2-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/entity2/**

# -- Swagger / SpringDoc Aggregation --
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Gom Swagger của downstream services lên Gateway
springdoc.swagger-ui.urls[0].name=entity1-service
springdoc.swagger-ui.urls[0].url=http://localhost:8081/v3/api-docs
springdoc.swagger-ui.urls[1].name=entity2-service
springdoc.swagger-ui.urls[1].url=http://localhost:8082/v3/api-docs
