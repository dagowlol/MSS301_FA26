spring.application.name=DE190484Entity2Service
server.port=8082

# Database Configuration (MS SQL Server 2016+)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Service 1 URL (consumed via OpenFeign)
entity1.service.url=http://localhost:8081

# OpenFeign client config cho client "entity1-service"
spring.cloud.openfeign.client.config.entity1-service.connect-timeout=3000
spring.cloud.openfeign.client.config.entity1-service.read-timeout=5000
spring.cloud.openfeign.client.config.entity1-service.logger-level=basic

# Swagger / SpringDoc API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
